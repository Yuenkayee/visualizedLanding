# Four-weather LR/early-stop baseline, original heads and loss.
seed: 20261006
data_root: data/landing_four_weather
image_size: 512
epochs: 40
learning_rate: 0.001
model:
  channels: 16
  keypoints: 4
device: cuda
batch_size: auto
max_batch_size: 16
memory_fraction: 0.85
precision: bf16
channels_last: true
tf32: true
cudnn_benchmark: true
num_workers: 8
threads: 4
prefetch_factor: 2
pin_memory: true
persistent_workers: true
log_every: 20
weathers:
- clear
- fog
- night
- night_fog
difficult_augmentation: false
touchdown_sampling_weight: 1
loss: {}
scheduler:
  mode: min
  factor: 0.5
  patience: 3
  min_lr: 1.0e-05
early_stopping_patience: 10
