# Legacy callback template. For the complete live-Simulink host, use
# main/closed_loop.yaml and shell/run_landing_closed_loop.sh (training geometry
# is resolved automatically there; this legacy template still requires values).
# Merge plant into offline_simulation.yaml ONLY after filling calibrated values.
# null values are intentionally unusable; no invented UH-60/vessel geometry.
backend: matlab
# Disable provisional training geometry; configure calibrated camera/LiDAR separately.
landing_config: null
navigation:
  require_gimbal: true
  filter_point_body: [0.0, 0.0, 0.0]
plant:
  initialize_callback: innerloop_initialize
  allow_state_hold: false
  # Name of future MATLAB function s=plant_step_callback(s,dt).
  plant_step_callback: null
  # [CG NED metres (3), native velocity knots (3), Euler radians (3), body pqr rad/s (3)]
  helicopter_state: null
  ship_state: null
  # Same resolved servo defaults as configs/gimbal.yaml; identify actual hardware.
  gimbal:
    enabled: true
  # Ship Euler angles are available to navigation with zero communication delay.
  # MATLAB System Nontunable parameters, set through Model Workspace.
  geometry:
    # Neutral optical orientation and FIXED optical-centre position in BODY.
    T_body_camera: null
    H_ship_body: null
    gear_body: null
